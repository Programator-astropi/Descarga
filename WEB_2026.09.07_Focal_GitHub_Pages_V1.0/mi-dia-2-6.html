<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focal — Tu día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ── TOKENS ── */
:root{
  --ink:#0e0f14;--ink2:#161820;--ink3:#1e2130;--ink4:#262a3e;--ink5:#313656;
  --rim:rgba(255,255,255,.06);--rim2:rgba(255,255,255,.10);--rim3:rgba(255,255,255,.16);
  --ember:#e8622a;--ember2:#f5834e;--ember3:#fbbf9a;
  --jade:#1fa464;--jade2:#29c97c;--jade3:#8fe8b8;
  --sky:#2979d4;--sky2:#4a9eff;
  --gold:#d4a017;--gold2:#f5c842;
  --rose:#c53860;--rose2:#f0617e;
  --purple:#6c5ce7;--purple2:#9b8fff;
  --tx:#f0f2ff;--tx2:#b8bdd8;--tx3:#6b7299;--tx4:#3d4266;
  --rsm:6px;--rmd:10px;--rlg:14px;
  --tr:.18s cubic-bezier(.4,0,.2,1);--sp:.32s cubic-bezier(.34,1.56,.64,1);
  --gap:10px;
}

/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;min-height:100vh}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--ink);color:var(--tx);min-height:100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 20% -10%,rgba(232,98,42,.12) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 110%,rgba(41,201,124,.07) 0%,transparent 55%);
}

/* ── SHELL: topbar + sidebar + content ── */
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;height:52px;flex-shrink:0;
  background:rgba(14,15,20,.94);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--rim2);z-index:30;
}
.logo{font-family:'Fraunces',serif;font-size:20px;font-weight:700;font-style:italic;color:var(--tx)}
.logo em{color:var(--ember2);font-style:normal}
.top-right{display:flex;align-items:center;gap:8px}
.dchip{font-size:11px;font-weight:500;color:var(--tx3);background:var(--ink3);border:1px solid var(--rim2);border-radius:20px;padding:4px 11px;white-space:nowrap;font-family:'DM Mono',monospace}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--jade2);box-shadow:0 0 7px var(--jade2);opacity:0;transition:opacity .4s}
.save-dot.show{opacity:1}

/* Body = sidebar (desktop) + scrollable content */
.body-wrap{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR — desktop only ── */
.sidebar{
  width:190px;flex-shrink:0;
  background:var(--ink2);border-right:1px solid var(--rim);
  display:flex;flex-direction:column;padding:14px 8px;gap:3px;overflow-y:auto;
}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--rmd);font-size:13px;font-weight:500;color:var(--tx3);cursor:pointer;transition:all var(--tr);border:1px solid transparent}
.nav-item i{font-size:16px;flex-shrink:0}
.nav-item:hover{color:var(--tx2);background:var(--ink3)}
.nav-item.on{color:var(--ember2);background:rgba(232,98,42,.1);border-color:rgba(232,98,42,.18)}
.nav-badge{margin-left:auto;font-size:10px;font-weight:700;background:var(--ember);color:#fff;border-radius:20px;padding:1px 6px;min-width:17px;text-align:center}
.nav-section{font-size:10px;font-weight:700;color:var(--tx4);text-transform:uppercase;letter-spacing:.1em;padding:10px 11px 3px;margin-top:2px}

/* ── BOTTOM NAV — mobile only ── */
.bot-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:rgba(14,15,20,.97);backdrop-filter:blur(20px);
  border-top:1px solid var(--rim2);
  padding:0 4px env(safe-area-inset-bottom,0);
}
.bot-nav-inner{display:flex;justify-content:space-around;align-items:stretch}
.bot-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:8px 6px;flex:1;cursor:pointer;
  font-size:10px;font-weight:600;color:var(--tx4);
  transition:color var(--tr);min-width:0;
  border:none;background:transparent;
}
.bot-item i{font-size:20px;transition:color var(--tr)}
.bot-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56px;font-size:9px}
.bot-item.on{color:var(--ember2)}
.bot-item.on i{color:var(--ember2)}
.bot-badge{
  position:absolute;top:6px;right:6px;
  width:15px;height:15px;border-radius:50%;
  background:var(--ember);color:#fff;font-size:8px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.bot-item-wrap{position:relative;display:flex;flex-direction:column;align-items:center;flex:1}

/* ── SCROLLABLE CONTENT ── */
.content{flex:1;overflow-y:auto;padding:16px 14px 80px;-webkit-overflow-scrolling:touch}

/* ── CARDS & GRID ── */
.card{background:var(--ink2);border:1px solid var(--rim);border-radius:var(--rlg);padding:14px 15px;transition:border-color var(--tr);animation:fadeUp .35s ease both}
.card:hover{border-color:var(--rim2)}
.ctitle{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.ctitle i{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.cf{grid-column:1/-1}
.page-title{font-family:'Fraunces',serif;font-size:clamp(18px,5vw,26px);font-weight:700;color:var(--tx);margin-bottom:14px;line-height:1.15}
.page-title span{color:var(--ember2);font-style:italic}

/* ── INPUTS ── */
input,select,textarea{
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;
  border:1px solid var(--rim2);border-radius:var(--rsm);
  background:var(--ink3);color:var(--tx);
  padding:0 11px;height:40px;outline:none;
  transition:border-color var(--tr),box-shadow var(--tr);width:100%;
  -webkit-appearance:none;
}
input::placeholder,textarea::placeholder{color:var(--tx4);font-weight:400}
input:focus,select:focus,textarea:focus{border-color:var(--ember);box-shadow:0 0 0 3px rgba(232,98,42,.15)}
select option{background:var(--ink3)}
textarea{height:auto;padding:10px 11px;resize:vertical;line-height:1.6}
.row{display:flex;gap:7px;margin-bottom:9px;align-items:center;flex-wrap:wrap}
.row>input{flex:1;min-width:100px}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:0 14px;height:40px;border-radius:20px;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;
  cursor:pointer;transition:all var(--tr);border:1px solid transparent;white-space:nowrap;
}
.btn:active{transform:scale(.94)}
.btn-ember{background:var(--ember);color:#fff;border-color:var(--ember)}.btn-ember:hover{background:var(--ember2)}
.btn-ghost{background:transparent;color:var(--tx2);border-color:var(--rim2)}.btn-ghost:hover{background:var(--ink3);border-color:var(--rim3)}
.btn-jade{background:var(--jade);color:#fff;border-color:var(--jade)}.btn-jade:hover{background:var(--jade2)}
.btn-ic{width:40px;height:40px;padding:0;border-radius:50%;background:var(--ink3);color:var(--tx2);border-color:var(--rim2);flex-shrink:0}
.btn-ic:hover{background:var(--ink4);border-color:var(--rim3)}
.btn-sm{height:32px;font-size:12px;padding:0 11px;border-radius:14px}

/* ── STAT CARDS ── */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.sc{background:var(--ink2);border:1px solid var(--rim);border-radius:var(--rlg);padding:12px 8px 10px;text-align:center;overflow:hidden;transition:transform var(--tr);animation:fadeUp .35s ease both;cursor:default}
.sc:hover{transform:translateY(-2px)}
.sc::before{content:'';display:block;height:3px;border-radius:3px 3px 0 0;margin:-12px -8px 12px;background:var(--ac,#333)}
.sc-icon{font-size:18px;color:var(--ac,var(--tx3));margin-bottom:5px;display:block}
.sc-val{font-size:clamp(18px,5vw,24px);font-weight:700;color:var(--tx);line-height:1;font-family:'DM Mono',monospace}
.sc-lbl{font-size:9px;font-weight:600;color:var(--tx3);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}

/* ── TASKS ── */
.tlist{list-style:none;display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto;padding-right:2px}
.ti{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:var(--rmd);border:1px solid var(--rim);background:var(--ink3);transition:opacity .2s,border-color var(--tr);animation:fadeUp .3s ease both}
.ti:hover{border-color:var(--rim2)}
.ti.done{opacity:.35}
.ti.done .ttxt{text-decoration:line-through;color:var(--tx3)}
.tchk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--tx4);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:11px;transition:all .18s}
.tchk.on{background:var(--jade);border-color:var(--jade);color:#fff;animation:popIn .25s ease}
.pbar{width:3px;height:20px;border-radius:3px;flex-shrink:0;opacity:.8}
.ttxt{font-size:13px;font-weight:500;flex:1;line-height:1.35;color:var(--tx);word-break:break-word}
.ttag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--ink4);color:var(--tx3);white-space:nowrap;flex-shrink:0}
.tdel{cursor:pointer;color:var(--tx4);font-size:14px;opacity:0;transition:opacity .14s,color .14s;padding:4px;flex-shrink:0}
.ti:hover .tdel,.ti:focus-within .tdel{opacity:1}
.tdel:hover{color:var(--rose2)}
.prog-wrap{height:3px;background:var(--ink4);border-radius:3px;margin-top:10px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:var(--jade);transition:width .5s var(--sp)}

/* ── HABITS ── */
.hlist{display:flex;flex-direction:column;gap:9px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 11px;border-radius:var(--rmd);border:1px solid var(--rim);background:var(--ink3);transition:border-color var(--tr)}
.hrow:hover{border-color:var(--rim2)}
.hleft{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.hicon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.hname{font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stk{font-size:10px;font-weight:700;border-radius:20px;padding:2px 7px;white-space:nowrap;flex-shrink:0}
.hdays{display:flex;gap:3px;flex-shrink:0}
.hday{
  width:clamp(22px,6vw,26px);height:clamp(22px,6vw,26px);
  border-radius:50%;border:1.5px solid var(--rim2);
  display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:700;color:var(--tx3);
  cursor:pointer;background:var(--ink3);transition:all .15s;user-select:none;
}
.hday:hover{transform:scale(1.1);border-color:var(--rim3)}
.hday.on{border-color:transparent;color:#fff}
.hday.td{border-color:var(--ember)}
.hday.td.on{border-color:transparent}

/* ── POMODORO RING ── */
.ring-wrap{position:relative;width:100%;max-width:240px;margin:8px auto 12px}
.ring-wrap svg{width:100%;height:auto;transform:rotate(-90deg);display:block}
.ring-bg{fill:none;stroke:var(--ink4);stroke-width:8}
.ring-fg{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .4s}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ring-time{font-family:'DM Mono',monospace;font-size:clamp(28px,9vw,42px);font-weight:500;color:var(--tx);letter-spacing:-1px;line-height:1}
.ring-lbl{font-size:11px;font-weight:600;color:var(--tx3);margin-top:4px;text-transform:uppercase;letter-spacing:.07em}
.ppills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;justify-content:center}
.ppill{font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;cursor:pointer;border:1px solid var(--rim2);background:var(--ink3);color:var(--tx3);transition:all .18s;user-select:none}
.ppill.on{background:rgba(232,98,42,.15);border-color:var(--ember);color:var(--ember2)}
.pdots{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--ink4);transition:all .28s}
.pdot.on{background:var(--ember2);box-shadow:0 0 8px var(--ember2);transform:scale(1.25)}

/* ── CALENDAR ── */
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-month-lbl{font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:var(--tx)}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cdn{font-size:9px;font-weight:700;color:var(--tx4);text-align:center;padding:4px 0;text-transform:uppercase}
.cday{border-radius:5px;border:1px solid transparent;padding:4px 2px;min-height:clamp(44px,11vw,60px);cursor:pointer;transition:border-color var(--tr),background var(--tr)}
.cday:hover{border-color:var(--rim2);background:var(--ink3)}
.cday.other{opacity:.22}
.cday.today .cnum{background:var(--ember);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 0 8px rgba(232,98,42,.5)}
.cday.sel{border-color:var(--ember);background:rgba(232,98,42,.07)}
.cnum{font-size:11px;font-weight:600;color:var(--tx2);line-height:1;margin-bottom:2px;width:22px;text-align:center;font-family:'DM Mono',monospace}
.cdots{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px}
.cdot{width:4px;height:4px;border-radius:50%}
.evlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.ev{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:var(--rmd);border:1px solid var(--rim);background:var(--ink3);animation:fadeUp .3s ease both;transition:border-color var(--tr)}
.ev:hover{border-color:var(--rim2)}
.evbar{width:3px;height:30px;border-radius:3px;flex-shrink:0}
.evbody{flex:1;min-width:0}
.evtxt{font-size:13px;font-weight:600;color:var(--tx)}
.evtime{font-size:11px;font-weight:500;color:var(--tx3);font-family:'DM Mono',monospace;margin-top:1px}
.evdel{cursor:pointer;color:var(--tx4);font-size:14px;opacity:0;transition:opacity .14s,color .14s;padding:4px}
.ev:hover .evdel{opacity:1}
.evdel:hover{color:var(--rose2)}
.cpk{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.cpc{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0}
.cpc.on{border-color:#fff;transform:scale(1.2)}

/* ── REMINDERS ── */
.rem-item{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:var(--rmd);border:1px solid var(--rim);background:var(--ink3);animation:fadeUp .3s ease both;transition:border-color var(--tr)}
.rem-item:hover{border-color:var(--rim2)}
.rem-item.soon{border-color:rgba(232,98,42,.35);background:rgba(232,98,42,.06)}
.rem-left{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.rem-txt{font-size:13px;font-weight:600;color:var(--tx)}
.rem-meta{font-size:11px;font-weight:500;color:var(--tx3);font-family:'DM Mono',monospace}
.rem-ring{width:9px;height:9px;border-radius:50%;flex-shrink:0;animation:pulse-ring 2s ease infinite}
.rem-del{cursor:pointer;color:var(--tx4);font-size:14px;opacity:0;transition:opacity .14s,color .14s;padding:4px;flex-shrink:0}
.rem-item:hover .rem-del{opacity:1}
.rem-del:hover{color:var(--rose2)}

/* ── GOALS ── */
.goal-item{padding:12px 13px;border-radius:var(--rmd);border:1px solid var(--rim);background:var(--ink3);animation:fadeUp .3s ease both;transition:border-color var(--tr)}
.goal-item:hover{border-color:var(--rim2)}
.goal-name{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.goal-prog-wrap{height:6px;background:var(--ink4);border-radius:6px;overflow:hidden;margin-bottom:5px}
.goal-prog-fill{height:100%;border-radius:6px;transition:width .5s var(--sp)}
.goal-meta{font-size:11px;font-weight:500;color:var(--tx3);display:flex;justify-content:space-between}

/* ── CLARINET ── */
.clar-subtabs{display:flex;gap:5px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.clar-subtab{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--rim2);background:var(--ink3);color:var(--tx3);transition:all var(--tr);white-space:nowrap;flex-shrink:0}
.clar-subtab:hover{border-color:var(--rim3);color:var(--tx2)}
.clar-subtab.on{background:rgba(108,92,231,.15);border-color:var(--purple);color:var(--purple2)}

/* ── CAÑAS ── */
.reed-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.reed-col-head{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--rim)}
.reed-col-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.reed-col-title{font-size:12px;font-weight:600;color:var(--tx2)}
.reed-col-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--tx4);margin-left:auto}
.reed-card{border:1px solid var(--rim2);border-radius:var(--rmd);padding:11px;display:flex;gap:9px;background:var(--ink3);transition:border-color var(--tr);animation:fadeUp .25s ease both}
.reed-card:hover{border-color:var(--rim3)}
.reed-card.hit{box-shadow:0 0 18px rgba(74,158,255,.12)}
.reed-num{font-family:'DM Mono',monospace;font-size:12.5px;color:var(--tx);letter-spacing:.03em}
.reed-del{background:none;border:none;color:var(--tx4);cursor:pointer;font-size:13px;padding:2px 4px;line-height:1;transition:color var(--tr);flex-shrink:0}
.reed-del:hover{color:var(--rose2)}
.reed-status{font-size:11px;color:var(--tx3);margin-bottom:2px}
.reed-last{font-size:11px;color:var(--tx4);margin-bottom:6px}
.reed-steps{list-style:none;margin:0 0 7px;padding:0;display:flex;flex-direction:column;gap:4px}
.reed-steps li label{display:flex;align-items:flex-start;gap:6px;cursor:pointer}
.reed-steps input[type=checkbox]{margin-top:2px;accent-color:var(--jade2);width:12px;height:12px;flex-shrink:0;cursor:pointer}
.reed-steps span{font-size:11px;color:var(--tx3);line-height:1.4}
.reed-steps span.ck{text-decoration:line-through;color:var(--tx4)}
.reed-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.reed-btn{font-size:10.5px;font-weight:500;cursor:pointer;background:none;border:1px solid var(--rim2);color:var(--tx3);padding:5px 8px;border-radius:var(--rsm);transition:all var(--tr);line-height:1.2;white-space:nowrap}
.reed-btn:hover:not(:disabled){color:var(--tx);border-color:var(--rim3)}
.reed-btn.adv{color:var(--sky2);border-color:rgba(74,158,255,.35)}.reed-btn.adv:hover:not(:disabled){background:rgba(74,158,255,.07);border-color:var(--sky2)}
.reed-btn.using{color:var(--rose2);border-color:rgba(240,97,126,.35)}.reed-btn.using:hover{background:rgba(240,97,126,.07);border-color:var(--rose2)}
.reed-btn:disabled{opacity:.32;cursor:not-allowed}
.reed-actions select.reed-btn{width:auto;height:auto;padding:5px 24px 5px 8px;font-size:10.5px}
.reed-scan-frame{margin-top:10px;border-radius:var(--rsm);border:1px solid var(--rim2);height:52px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.reed-scan-line{position:absolute;left:0;width:100%;height:1.5px;background:var(--sky2);box-shadow:0 0 8px 1px rgba(74,158,255,.7);animation:reedScan .34s linear}
.reed-miss{margin-top:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border:1px dashed var(--rim2);border-radius:var(--rsm);padding:11px 13px}
.reed-pill{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.05em;padding:2px 8px;border-radius:4px;margin-bottom:6px;display:inline-block}

/* Phase cards — fluid 3-col on wide, 1-col on narrow */
.phase-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.phase-card{
  position:relative;overflow:hidden;
  border-radius:var(--rlg);border:1.5px solid var(--rim);
  background:var(--ink2);padding:1.1rem .9rem 1rem;
  cursor:pointer;transition:border-color .25s,box-shadow .25s,transform .2s;
  animation:fadeUp .45s ease both;
}
.phase-card::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse 80% 60% at 50% 0%,var(--ph-glow,rgba(108,92,231,.18)) 0%,transparent 70%);pointer-events:none;transition:opacity .3s;opacity:.6}
.phase-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.4),0 0 0 1px var(--ph-col,var(--purple))}
.phase-card:hover::after{opacity:1}
.phase-card.active{border-color:var(--ph-col,var(--purple));box-shadow:0 0 0 1px var(--ph-col,var(--purple)),0 0 20px var(--ph-glow,rgba(108,92,231,.2))}
.phase-card.done-card{border-color:var(--jade);opacity:.75}
.phase-done-badge{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--jade);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;z-index:2;animation:popIn .3s ease}
.phase-icon-wrap{width:clamp(38px,10vw,50px);height:clamp(38px,10vw,50px);border-radius:12px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5vw,22px);background:var(--ph-bg,rgba(108,92,231,.15));color:var(--ph-col,var(--purple2));position:relative;z-index:1;box-shadow:0 3px 12px var(--ph-glow,rgba(108,92,231,.25));transition:transform .2s}
.phase-card:hover .phase-icon-wrap{transform:scale(1.06) translateY(-1px)}
.phase-card.active .phase-icon-wrap{animation:pulse-icon 2s ease infinite}
.phase-name{font-size:clamp(12px,3.5vw,15px);font-weight:700;color:var(--tx);text-align:center;margin-bottom:4px;position:relative;z-index:1}
.phase-dur-badge{display:inline-flex;align-items:center;gap:3px;background:var(--ph-bg,rgba(108,92,231,.12));border:1px solid var(--ph-col,var(--purple));color:var(--ph-col,var(--purple2));border-radius:20px;padding:2px 9px;font-size:10px;font-weight:700;font-family:'DM Mono',monospace;margin:0 auto 6px;width:fit-content;position:relative;z-index:1}
.phase-desc{font-size:10px;color:var(--tx3);text-align:center;line-height:1.5;position:relative;z-index:1}
.phase-stepper{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:9px;position:relative;z-index:2}
.step-btn{width:24px;height:24px;border-radius:50%;background:var(--ink4);border:1px solid var(--rim2);color:var(--tx2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-weight:700;line-height:1}
.step-btn:hover{background:var(--ph-bg,rgba(108,92,231,.18));border-color:var(--ph-col,var(--purple));color:var(--ph-col,var(--purple2))}
.step-val{font-family:'DM Mono',monospace;font-size:16px;font-weight:700;color:var(--tx);min-width:36px;text-align:center}

/* Arc ring for technique session — fluid */
.arc-wrap{position:relative;width:100%;max-width:260px;margin:0 auto 12px}
.arc-wrap svg{width:100%;height:auto;transform:rotate(-90deg);display:block;overflow:visible}
.arc-track{fill:none;stroke:var(--ink4);stroke-width:9}
.arc-fill{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .95s linear,stroke .4s}
.arc-glow{fill:none;stroke-width:16;stroke-linecap:round;opacity:.15;transition:stroke-dashoffset .95s linear,stroke .4s;filter:blur(5px)}
.arc-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.arc-time{font-family:'DM Mono',monospace;font-size:clamp(32px,10vw,48px);font-weight:500;letter-spacing:-2px;line-height:1;color:var(--tx)}
.arc-phase-name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-top:5px}
.arc-phase-desc{font-size:10px;color:var(--tx3);margin-top:2px;max-width:180px;text-align:center;padding:0 8px}
.flow-bar{display:flex;gap:3px;width:100%;height:7px;border-radius:7px;overflow:hidden}
.flow-seg{border-radius:7px;transition:all .5s var(--sp);min-width:3px}

/* Streak */
.streak-hero{display:flex;flex-direction:column;align-items:center;gap:5px;padding:18px 16px;border-radius:var(--rlg);background:linear-gradient(135deg,rgba(108,92,231,.15) 0%,rgba(108,92,231,.05) 100%);border:1px solid rgba(108,92,231,.25);margin-bottom:14px;animation:fadeUp .4s ease both}
.streak-fire{font-size:32px;line-height:1;animation:float 3s ease-in-out infinite}
.streak-count{font-family:'DM Mono',monospace;font-size:clamp(36px,12vw,48px);font-weight:700;color:var(--purple2);line-height:1}
.streak-label{font-size:13px;font-weight:600;color:var(--tx3)}
.streak-sub{font-size:11px;color:var(--tx4);margin-top:1px}
.streak-badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:5px}
.streak-badge-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid var(--rim2);color:var(--tx3);background:var(--ink3)}
.streak-badge-chip.earned{border-color:var(--gold2);color:var(--gold2);background:rgba(212,160,23,.1)}
.streak-heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}
.heat-cell{aspect-ratio:1;border-radius:3px;background:var(--ink4);transition:background .3s,transform .2s}
.heat-cell:hover{transform:scale(1.12)}
.heat-cell.h1{background:rgba(108,92,231,.25)}
.heat-cell.h2{background:rgba(108,92,231,.5)}
.heat-cell.h3{background:rgba(108,92,231,.75)}
.heat-cell.h4{background:#6c5ce7;box-shadow:0 0 6px rgba(108,92,231,.5)}
.heat-cell.today-cell{outline:2px solid var(--ember);outline-offset:1px}

/* Piece list */
.clar-piece-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;padding-right:2px}
.clar-piece{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border-radius:var(--rmd);border:1px solid var(--rim2);background:var(--ink3);cursor:pointer;transition:border-color var(--tr),background var(--tr),transform var(--tr)}
.clar-piece:hover{border-color:var(--rim3);transform:translateY(-1px)}
.clar-piece.on{border-color:rgba(232,98,42,.6);background:rgba(232,98,42,.08)}
.clar-piece-title{font-size:13px;font-weight:600;color:var(--tx)}
.clar-piece-meta{font-size:11px;color:var(--tx3)}
.clar-piece-sessions{font-size:11px;font-family:'DM Mono',monospace;color:var(--jade3);margin-top:2px}

/* Metronome */
.metro-bpm{font-size:clamp(28px,9vw,36px);font-weight:700;font-family:'DM Mono',monospace;color:var(--tx)}
.metro-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-bottom:3px}
.metro-led{width:14px;height:14px;border-radius:50%;background:var(--ink4);border:1px solid var(--rim2);transition:background .06s,transform .06s,box-shadow .06s}
.metro-led.on{background:var(--ember2);box-shadow:0 0 12px var(--ember2);transform:scale(1.5)}

/* Misc */
.smsg{font-size:12px;font-weight:500;color:var(--tx3);min-height:16px;margin-bottom:6px}
.empty{font-size:13px;font-weight:500;color:var(--tx4);text-align:center;padding:14px 0}
.divider{height:1px;background:var(--rim);margin:12px 0}
.tip-box{border-radius:var(--rlg);border:1px solid rgba(108,92,231,.2);background:rgba(108,92,231,.07);padding:.8rem .9rem;margin-top:8px}
.tip-box-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--purple2);margin-bottom:3px}
.tip-box-text{font-size:12px;color:var(--tx2);line-height:1.6;font-style:italic}
.score-frame{width:100%;height:260px;border:none;border-radius:var(--rsm);background:var(--ink4)}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(.5);opacity:0}65%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@keyframes pulse-ring{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes pulse-icon{0%,100%{box-shadow:0 3px 12px var(--ph-glow,rgba(108,92,231,.25))}50%{box-shadow:0 3px 24px var(--ph-glow,rgba(108,92,231,.55))}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes reedScan{from{top:0}to{top:100%}}

/* ── RESPONSIVE BREAKPOINTS ── */

/* Tablet: 2-col grid, sidebar shown */
@media(min-width:680px){
  .bot-nav{display:none}
  .stats{grid-template-columns:repeat(4,1fr)}
  .content{padding:20px 18px 40px}
  .card{padding:1.1rem 1.15rem}
  .topbar{padding:0 20px;height:56px}
  .logo{font-size:22px}
  .dchip{font-size:12px}
}

/* Mobile: hide sidebar, show bottom nav */
@media(max-width:679px){
  .sidebar{display:none}
  .bot-nav{display:block}
  /* Make all grids single column on mobile */
  .grid{grid-template-columns:1fr}
  .cf{grid-column:1}
  /* Phase grid: 1 column on small mobile, 3 col on wider mobile */
  .phase-grid{grid-template-columns:1fr}
  /* Content extra bottom padding for bottom nav */
  .content{padding:12px 12px 90px}
  /* Habits: stack name + days on tiny screens */
  .hrow{flex-wrap:wrap;gap:6px}
  .hleft{min-width:100%}
  .hdays{width:100%;justify-content:space-between}
  .hday{flex:1;max-width:36px;height:32px;border-radius:7px;font-size:9px}
  /* Tasks: hide tag on mobile */
  .ttag{display:none}
  /* Delete always visible on mobile (no hover) */
  .tdel{opacity:.6}
  .evdel{opacity:.6}
  .rem-del{opacity:.6}
  /* Calendar slightly smaller */
  .cday{min-height:38px}
  /* Tips grid: single col */
  .tips-grid-2{grid-template-columns:1fr!important}
  /* Clarinet obras: single col */
  .obras-grid{grid-template-columns:1fr!important}
  /* Reed cols: single col on mobile */
  .reed-cols{grid-template-columns:1fr!important}
}

/* Medium mobile (≥400px): phase grid 3 col again */
@media(min-width:400px) and (max-width:679px){
  .phase-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hrow{flex-wrap:nowrap}
  .hleft{min-width:auto}
  .hdays{width:auto;justify-content:flex-start}
  .hday{flex:none;width:clamp(22px,6vw,26px);height:clamp(22px,6vw,26px);border-radius:50%}
}

::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ink5);border-radius:4px}
